<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box  { fill: #fff; stroke: #444; stroke-width: 1.2; rx: 6; }
      .grp  { fill: #f4f6fa; stroke: #7a8aa6; stroke-width: 1.2; stroke-dasharray: 5 3; rx: 8; }
      .stg  { fill: #e3f2e1; stroke: #4c9a4a; stroke-width: 1.1; rx: 5; }
      .ext  { fill: #e8f0fb; stroke: #3d6fb6; stroke-width: 1.2; rx: 6; }
      .ln   { stroke: #444; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
      .t    { text-anchor: middle; dominant-baseline: middle; }
      .h    { font-weight: bold; }
      .s    { font-size: 10px; fill: #555; }
    </style>
  </defs>

  <!-- Source control -->
  <rect class="box" x="10" y="40" width="110" height="46"/>
  <text class="t h" x="65" y="63">Developer</text>
  <rect class="ext" x="170" y="40" width="130" height="46"/>
  <text class="t h" x="235" y="56">GitHub</text>
  <text class="t s" x="235" y="73">calculator-devops</text>
  <path class="ln" d="M120,63 H168"/>
  <text class="t s" x="144" y="52">git push</text>

  <!-- Jenkins -->
  <rect class="grp" x="350" y="10" width="420" height="150"/>
  <text class="t h" x="560" y="27">Jenkins: declarative pipeline (Jenkinsfile)</text>
  <path class="ln" d="M300,63 H348"/>
  <text class="t s" x="325" y="44">webhook /</text>
  <text class="t s" x="325" y="56">poll SCM</text>

  <rect class="stg" x="362" y="42" width="120" height="34"/><text class="t" x="422" y="59">1 Checkout</text>
  <rect class="stg" x="500" y="42" width="120" height="34"/><text class="t" x="560" y="59">2 Build (mvnw)</text>
  <rect class="stg" x="638" y="42" width="120" height="34"/><text class="t" x="698" y="59">3 Test + JUnit</text>
  <rect class="stg" x="362" y="100" width="120" height="34"/><text class="t" x="422" y="117">4 Docker Build</text>
  <rect class="stg" x="500" y="100" width="120" height="34"/><text class="t" x="560" y="117">5 Push</text>
  <rect class="stg" x="638" y="100" width="120" height="34"/><text class="t" x="698" y="117">6 Deploy</text>
  <path class="ln" d="M482,59 H498"/>
  <path class="ln" d="M620,59 H636"/>
  <path class="ln" d="M698,76 V84 H422 V98"/>
  <path class="ln" d="M482,117 H498"/>
  <path class="ln" d="M620,117 H636"/>
  <text class="t s" x="560" y="150">post: e-mail SUCCESS / FAILURE</text>

  <!-- Outputs -->
  <rect class="ext" x="170" y="190" width="150" height="46"/>
  <text class="t h" x="245" y="206">E-mail (Gmail)</text>
  <text class="t s" x="245" y="223">build status</text>
  <path class="ln" d="M470,150 H322 V188"/>

  <rect class="ext" x="350" y="190" width="150" height="46"/>
  <text class="t h" x="425" y="206">Docker Hub</text>
  <text class="t s" x="425" y="223">gathik/calculator-devops</text>
  <path class="ln" d="M560,134 V170 H425 V188"/>

  <!-- Deployment -->
  <rect class="grp" x="530" y="176" width="240" height="146"/>
  <text class="t h" x="650" y="192">Docker Compose (calculator-net)</text>
  <path class="ln" d="M740,134 V174"/>
  <rect class="box" x="545" y="230" width="90" height="44"/>
  <text class="t h" x="590" y="246">nginx</text>
  <text class="t s" x="590" y="262">host :8085</text>
  <rect class="stg" x="665" y="208" width="95" height="40"/>
  <text class="t" x="712" y="221">calculator #1</text>
  <text class="t s" x="712" y="237">:8080 healthy</text>
  <rect class="stg" x="665" y="262" width="95" height="40"/>
  <text class="t" x="712" y="275">calculator #2</text>
  <text class="t s" x="712" y="291">:8080 healthy</text>
  <path class="ln" d="M635,246 L663,230"/>
  <path class="ln" d="M635,258 L663,280"/>

  <!-- Client -->
  <text class="t s" x="590" y="312">curl /api/v1/... → nginx</text>
</svg>
