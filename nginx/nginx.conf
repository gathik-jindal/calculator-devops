# Reverse proxy in front of the calculator replicas.
#
# Docker's embedded DNS (127.0.0.11) returns one A record per replica of the
# "calculator" service. Using a variable in proxy_pass makes nginx re-resolve
# the name, so it keeps working after Jenkins redeploys containers with new IPs,
# and nginx round-robins requests across the replicas.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $calculator_upstream http://calculator:8080;

    location / {
        proxy_pass $calculator_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shows which replica handled the request (useful in the demo)
        add_header X-Upstream $upstream_addr always;
    }
}
