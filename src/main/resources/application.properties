spring.application.name=calculator
server.port=${SERVER_PORT:8080}

# Render BigDecimal results as plain numbers (100, not 1E+2)
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator: expose only the health endpoint (used by Docker / Compose health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
